name: Release

# Push a tag like v1.0.0 to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FFMPEG_VERSION: "9.0"

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Build universal LGPL ffmpeg
        run: |
          set -euo pipefail
          # Static, LGPL-only ffmpeg + ffprobe. LGPL is guaranteed by never
          # passing --enable-gpl/--enable-nonfree; --disable-autodetect keeps the
          # build hermetic (system libs only); every encoder is disabled except
          # mov_text, since the app only stream-copies and converts text subtitles.
          curl -LsO "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          COMMON=(
            --disable-shared --enable-static
            --disable-programs --enable-ffmpeg --enable-ffprobe
            --disable-doc --disable-htmlpages --disable-manpages --disable-txtpages
            --disable-network --disable-devices --disable-autodetect
            --enable-zlib --enable-iconv --enable-videotoolbox --extra-libs=-liconv
            --disable-encoders --enable-encoder=movtext,ac3,aac
          )
          build() {
            local dir=$1; shift
            tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
            mv "ffmpeg-${FFMPEG_VERSION}" "$dir"
            pushd "$dir" >/dev/null
            ./configure "${COMMON[@]}" "$@" 2>&1 | tee configure.log
            grep -q "License: LGPL" configure.log
            make -j3 ffmpeg ffprobe
            popd >/dev/null
          }
          build ff-arm64
          build ff-x86_64 --enable-cross-compile --arch=x86_64 \
            --cc="clang -arch x86_64" --extra-cflags="-arch x86_64" \
            --extra-ldflags="-arch x86_64" --disable-x86asm

          mkdir -p Beam.app/Contents/Resources
          lipo -create -output Beam.app/Contents/Resources/ffmpeg  ff-arm64/ffmpeg  ff-x86_64/ffmpeg
          lipo -create -output Beam.app/Contents/Resources/ffprobe ff-arm64/ffprobe ff-x86_64/ffprobe
          cp ff-arm64/COPYING.LGPLv2.1 Beam.app/Contents/Resources/ffmpeg-LICENSE.txt

      - name: Build universal app, sign, notarize, and package
        env:
          VERSION: ${{ github.ref_name }}
          # Signing/notarization secrets (see README). When absent, the build
          # falls back to ad-hoc signing so forks still produce a working app.
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          # plutil takes the value as a separate argument (no shell interpolation
          # of the tag into a command string).
          plutil -replace CFBundleShortVersionString -string "$V" Beam.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$V" Beam.app/Contents/Info.plist

          mkdir -p Beam.app/Contents/MacOS
          swiftc -O -target arm64-apple-macos12  Sources/*.swift -o app-arm64
          swiftc -O -target x86_64-apple-macos12 Sources/*.swift -o app-x86_64
          lipo -create -output Beam.app/Contents/MacOS/Beam app-arm64 app-x86_64

          chmod +x Beam.app/Contents/Resources/ffmpeg Beam.app/Contents/Resources/ffprobe
          lipo -info Beam.app/Contents/MacOS/Beam Beam.app/Contents/Resources/ffmpeg

          if [ -n "$MACOS_CERT_P12_BASE64" ]; then
            echo "Developer ID signing + notarization"
            # Import the cert into a throwaway keychain.
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KPW="$(uuidgen)"
            security create-keychain -p "$KPW" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KPW" "$KEYCHAIN"
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | awk -F'"' '/Developer ID Application/{print $2; exit}')"
            echo "Signing identity: $IDENTITY"

            SIGN=(codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN")
            # Inside-out: nested tools first, then the app bundle.
            "${SIGN[@]}" Beam.app/Contents/Resources/ffmpeg
            "${SIGN[@]}" Beam.app/Contents/Resources/ffprobe
            "${SIGN[@]}" Beam.app
            codesign --verify --strict --verbose=2 Beam.app

            # Notarize the app, then staple the ticket so it launches offline.
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent Beam.app notarize.zip
            xcrun notarytool submit notarize.zip \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple Beam.app
            spctl --assess --type execute --verbose=4 Beam.app
            SIGNED=1
          else
            echo "No signing secrets present — ad-hoc signing (Gatekeeper will quarantine)."
            codesign --force --sign - Beam.app/Contents/Resources/ffmpeg
            codesign --force --sign - Beam.app/Contents/Resources/ffprobe
            codesign --force --deep --sign - Beam.app
            SIGNED=0
          fi

          # Zip is what the in-app self-updater downloads.
          ditto -c -k --keepParent Beam.app Beam.zip

          # DMG is the drag-to-Applications installer for first-time downloads.
          STAGE="$RUNNER_TEMP/dmg"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R Beam.app "$STAGE/Beam.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Beam -srcfolder "$STAGE" -ov -format UDZO Beam.dmg
          if [ "$SIGNED" = 1 ]; then
            # Sign, notarize, and staple the dmg itself so opening it is clean too.
            codesign --force --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN" Beam.dmg
            xcrun notarytool submit Beam.dmg \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple Beam.dmg
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Beam.dmg Beam.zip --generate-notes --title "$GITHUB_REF_NAME"
